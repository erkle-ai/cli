name: Publish

# Runs in the public repository when a release tag arrives: publishes the
# package to npm with provenance, then creates the GitHub release from the
# tag's notes. Uses npm trusted publishing (OIDC), so no npm token is stored.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'erkle-ai/cli'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The checkout leaves a lightweight ref; fetch the annotated tag for its notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "${title:-$GITHUB_REF_NAME}" --notes-file notes.md
